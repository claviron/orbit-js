[package]
name = "orbit-js-example-addon"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
orbit-js = { path = "../..", features = ["napi"] }
napi = { version = "3", default-features = false, features = ["napi8"] }
napi-derive = "3"

[build-dependencies]
napi-build = "2"
